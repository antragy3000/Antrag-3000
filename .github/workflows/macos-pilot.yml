# GitHub Actions: macOS-Pilot-Build fuer Antrag 3000.
#
# Baut auf einem macOS-Cloud-Runner ein UNIVERSAL-.dmg (laeuft auf Intel
# UND Apple Silicon). Bewusst:
#   - OHNE Code-Signing/Notarisierung  -> Pilot-Tester oeffnen die App
#     einmalig per Rechtsklick -> "Oeffnen" (kein Apple-Konto noetig).
#   - OHNE Auto-Update-Artefakte       -> kein Signatur-Schluessel noetig,
#     Verteilung fuer den Pilot von Hand (.dmg weitergeben).
#
# Laeuft AUTOMATISCH bei jeder neuen Version (wenn sich die Versionsnummer in
# src-tauri/tauri.conf.json aendert und nach master gepusht wird) sowie
# jederzeit von Hand ("Actions" -> "macOS-Pilot-Build" -> "Run workflow").
# Nach ~15-25 Min liegt unten beim Lauf das Artefakt
# "Antrag-3000-macOS-universal" (enthaelt die .dmg) zum Download.

name: macOS-Pilot-Build

# Ausloeser:
#   - push auf master, ABER nur wenn tauri.conf.json (= Versionsnummer)
#     geaendert wurde -> so baut jede Auslieferung automatisch mit, ohne
#     dass jeder normale Commit ~20 Min macOS-Build-Zeit verbraucht.
#   - workflow_dispatch: zusaetzlich jederzeit von Hand startbar.
on:
  push:
    branches: [master]
    paths:
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust einrichten (beide Apple-Architekturen)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust-Build-Cache (macht spaetere Laeufe schneller)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: JS-Abhaengigkeiten installieren
        run: npm ci

      # Universal = ein Paket fuer Intel + Apple Silicon. --bundles dmg baut
      # nur die .dmg (das die .app enthaelt). Das --config schaltet die
      # Updater-Artefakte ab, damit KEIN Signatur-Schluessel gebraucht wird.
      - name: Universal-.dmg bauen (unsigniert, ohne Updater)
        env:
          # Ad-hoc-Signatur ("-"): kein Apple-Zertifikat noetig.
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: .dmg als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Antrag-3000-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # --- macOS-Version auf den Update-Server legen (fuer den In-App-Hinweis) ---
      # Legt die .dmg + eine mac.json (Version, Download-URL, SHA-256, Notiz)
      # nach /updates/ auf den Server. Aeltere Mac-Installationen sehen dann den
      # Hinweis. Laeuft NUR, wenn das Repo-Secret MAC_DEPLOY_SSH_KEY gesetzt ist;
      # sonst wird der Upload uebersprungen (Build/Artefakt bleiben erhalten).
      - name: Pruefen, ob Deploy-Schluessel vorhanden ist
        id: deploy
        run: echo "vorhanden=${{ secrets.MAC_DEPLOY_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: .dmg + mac.json auf den Update-Server hochladen
        if: steps.deploy.outputs.vorhanden == 'true'
        env:
          SSH_KEY: ${{ secrets.MAC_DEPLOY_SSH_KEY }}
        run: |
          set -e
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          ZIEL="Antrag-3000_${VERSION}_universal.dmg"
          HASH=$(shasum -a 256 "$DMG" | awk '{print $1}')
          NOTES=$(git log -1 --pretty=%s | sed 's/["\\]/\\&/g')
          cp "$DMG" "$ZIEL"
          printf '{\n  "version": "%s",\n  "url": "https://sync.antrag3000.de/updates/mac/%s",\n  "sha256": "%s",\n  "notes": "%s"\n}\n' \
            "$VERSION" "$ZIEL" "$HASH" "$NOTES" > mac.json
          echo "mac.json:"; cat mac.json
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H sync.antrag3000.de >> ~/.ssh/known_hosts 2>/dev/null
          BASIS=/home/antrag/Antrag-3000/server/updates
          ssh -i ~/.ssh/id_ed25519 antrag@sync.antrag3000.de "mkdir -p $BASIS/mac"
          scp -i ~/.ssh/id_ed25519 "$ZIEL" "antrag@sync.antrag3000.de:$BASIS/mac/"
          scp -i ~/.ssh/id_ed25519 mac.json "antrag@sync.antrag3000.de:$BASIS/mac.json"
          echo "OK: $ZIEL (SHA-256 $HASH) und mac.json hochgeladen."
